<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#075be8">
    <title>Conectado em Sergipe — Sem conexão</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: #14213a; background: #f3f7fc; font-family: Inter, system-ui, sans-serif; }
        main { width: min(100%, 440px); padding: 30px; text-align: center; border-radius: 22px; background: #fff; box-shadow: 0 20px 55px rgba(15, 23, 42, .12); }
        img { width: 82px; height: 82px; border-radius: 20px; }
        h1 { margin: 18px 0 8px; font-size: 1.35rem; }
        p { margin: 0 0 20px; color: #60718a; line-height: 1.55; }
        button { min-height: 42px; padding: 10px 18px; border: 0; border-radius: 11px; color: #fff; background: #075be8; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/pwa/icon-192.png" alt="Conectado em Sergipe">
        <h1>Você está sem conexão</h1>
        <p>Assim que a internet voltar, recarregue para continuar acessando serviços e oportunidades de Sergipe.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
